          <path class="curve-grid" d="M25 0V100 M50 0V100 M75 0V100 M0 25H100 M0 50H100 M0 75H100"/>
          <path class="curve-grid" d="M0 100L100 0"/>
          <path class="curve-line" style="stroke:${colors[ch]}" d="${curvePath(pointY)}"/>
          <circle class="curve-point" style="stroke:${colors[ch]}" cx="50" cy="${pointY}" r="2.6"/>
          <circle class="curve-hit" cx="50" cy="${pointY}" r="9.5" data-curve-point="true"/>
        </svg></div>`;
    }
    function toneControls(){return state.group==='曲线'?curve():`<div class="parameters">${(sections[state.group]||sections['光线']).map(x=>parameter(...x)).join('')}</div>`;}
    function maskControls(){
      const draft=state.draft;
      if(!draft.maskCount)return `<div class="empty-mask"><button type="button" class="add-mask" data-action="new-mask">${icon('plus')}新建蒙版</button></div>`;
      const editingRange=state.maskMode==='范围';
      const header=`<div class="mask-top"><button type="button" class="mask-picker" data-action="mask-actions"><span class="mini-mask"></span>蒙版 ${draft.maskCount}${icon('chevron-down')}</button><div style="display:flex;align-items:center;gap:6px"><button type="button" class="mask-mode-button" data-action="mask-mode" data-value="${editingRange?'调整':'范围'}">${editingRange?'调整参数':'编辑范围'}</button>${button('new-mask','plus','新建蒙版')}</div></div>`;
      const shape=draft.maskType==='径向渐变'
        ?parameter('旋转','maskRotation',-180,180,1,'°')
        :parameter(draft.maskType==='画笔'?'大小':'过渡范围','maskRadius',5,75,1,'%');
      const parameters=state.maskMode==='范围'
        ?shape+parameter('羽化','maskFeather',0,100,1,'%')+parameter('不透明度','maskOpacity',0,100,1,'%')
        :parameter('曝光','exposure',-2,2,.05,'EV')+parameter('饱和度','saturation',-100,100,1,'')+parameter('阴影','shadows',-100,100,1,'');
      return header+`<div class="parameters">${parameters}</div>`;
    }
    function cropControls(){const d=state.draft;return `<div class="crop-actions"><div class="crop-actions-center">${button('rotate-left','rotate-ccw','向左旋转 90 度')}${button('rotate-right','rotate-cw','向右旋转 90 度')}</div><button type="button" class="reset" data-action="reset-crop">复位</button></div><label class="angle"><output data-angle>${d.angle.toFixed(1)}°</output><input type="range" min="-45" max="45" step=".1" value="${d.angle}" data-field="angle" aria-label="自由旋转角度"></label><div class="ratios" role="group" aria-label="裁切比例">${ratioList.map(([name,r])=>{const w=r>=1?25:25*(r||1.4),h=r>=1?25/r:25;return `<button type="button" data-action="ratio" data-value="${name}" class="ratio ${name==='自由'?'free':''} ${name==='原图'?'original':''} ${d.ratio===name?'active':''}" aria-pressed="${d.ratio===name}"><span class="ratio-shape" style="width:${w}px;height:${h}px"></span><span>${name}</span></button>`;}).join('')}</div>`;}
    function editor(){
      const isCurve=state.tool==='tone'&&state.group==='曲线';
      const panelClass=isCurve?'curve-controls':state.tool+'-controls';
      const controls=state.tool==='tone'?toneControls():state.tool==='mask'?maskControls():cropControls();
      return `<header class="photo-header">${button('cancel-edit','x','撤销本次修改并退出')}<div class="editor-title">${state.tool==='crop'?`<span data-size>${cropSize()}</span>`:''}</div>${button('undo','undo-2','撤销上一步',state.undo.length?'':'disabled')}${button('redo','redo-2','重做上一步',state.redo.length?'':'disabled')}${button('edit-more','ellipsis','编辑操作')}<button type="button" class="done" data-action="save-edit">完成</button></header>
        ${photoSurface(true)}
        <section class="controls ${panelClass}" aria-label="${state.tool==='tone'?'调色参数':state.tool==='mask'?'蒙版参数':'旋转裁切参数'}">${editorHeading()}${controls}</section>`;
    }
    function cropSize(){const d=initial();const ratio=(ratioList.find(x=>x[0]===d.ratio)||['',3/2])[1]||3/2;const base=d.turns%2?4000:6000;const height=d.turns%2?6000:4000;const w=Math.min(base,height*ratio)*d.cropScale;return `${Math.round(w)} × ${Math.round(w/ratio)}`;}
    function choice(action,name,label,sub='',end=''){return `<button type="button" class="choice" data-action="${action}">${icon(name)}<span class="choice-copy">${label}${sub?`<small>${sub}</small>`:''}</span>${end}</button>`;}
    function sheet(){
      if(!state.sheet)return '';
      let title='',body='';const close=`<button type="button" class="sheet-close" data-action="close-sheet" aria-label="关闭面板">${icon('x')}</button>`;
      const selected=t=>`<span class="radio ${state.exportType===t?'on':''}">${state.exportType===t?icon('check'):''}</span>`;
      switch(state.sheet){
        case 'export':title='导出照片';body=`<div class="choice-list">${choice('export-edited','image','编辑后 JPEG','调色、蒙版与裁切',selected('edited'))}${choice('export-embedded','camera','相机内嵌 JPEG','不应用编辑',selected('embedded'))}</div><div class="summary-row"><span>格式</span><span>JPEG</span></div><div class="summary-row"><span>尺寸</span><span>${state.exportType==='edited'?cropSize():'6000 × 4000'}</span></div><button type="button" class="primary-button" data-action="export-now">保存到相册</button>`;break;
        case 'delete':title=state.selecting?'删除 1 张照片？':'删除照片？';body=`<div class="delete-preview"><img src="${photos[state.photo]}" alt=""><span>IMG_0827.CR3<small class="muted" style="display:block;font-size:12px;margin-top:4px">原片</small></span></div><p class="delete-note">将删除设备上的原片，若图无法恢复。</p><button type="button" class="danger-button" data-action="confirm-delete">删除照片</button><button type="button" class="cancel-button" data-action="close-sheet">取消</button>`;break;
        case 'info':title='照片信息';body=`<div class="info-grid"><div><small>相机</small>Canon EOS R6 II</div><div><small>镜头</small>RF 24–105mm</div><div><small>光圈 / 快门</small>ƒ/8 · 1/250s</div><div><small>ISO / 焦距</small>ISO 100 · 35mm</div><div><small>文件</small>IMG_0827.CR3</div><div><small>分辨率</small>6000 × 4000</div></div><div class="choice-list">${choice('histogram','chart-no-axes-column','直方图',state.histogram?'显示中':'已隐藏',state.histogram?icon('check'):'')}</div>`;break;
        case 'new-mask':title='新建蒙版';body=`<div class="choice-list">${[['画笔','brush'],['线性渐变','move-vertical'],['径向渐变','circle']].map(([n,i])=>`<button type="button" class="choice" data-action="create-mask" data-value="${n}">${icon(i)}<span class="choice-copy">${n}</span></button>`).join('')}</div>`;break;
        case 'mask-actions':title='蒙版 1';body=`<div class="choice-list">${choice('toggle-mask','eye','显示选区')}${choice('duplicate-mask','copy','复制蒙版')}${choice('invert-mask','flip-horizontal','反转范围')}${choice('remove-mask','trash-2','删除蒙版')}</div>`;break;
        case 'edit-more':title='编辑操作';body=`<div class="choice-list">${choice('copy-edit','copy','复制调色参数')}${choice('paste-edit','clipboard-paste','粘贴调色参数',state.clipboard?'':'尚未复制参数')}${choice('reset-all','rotate-ccw','复位本次全部调整')}</div>`;break;
        case 'sources':title='照片来源';body=`<div class="choice-list">${choice('source-local','images','系统相册','当前来源',icon('check'))}${choice('source-folder','folder-open','授权目录')}${choice('source-add','plus','添加目录')}</div>`;break;
        case 'gallery-more':title='图库';body=`<div class="choice-list">${choice('refresh','refresh-cw','刷新照片')}${choice('sources','folder-open','照片来源')}${choice('settings','sliders-horizontal','图库设置')}</div>`;break;
        case 'viewer-more':title='照片';body=`<div class="choice-list">${choice('info','info','照片信息')}${choice('histogram','chart-no-axes-column','直方图',state.histogram?'显示中':'已隐藏')}</div>`;break;
        default:title='图库设置';body=`<div class="choice-list">${choice('filter-raw','image','仅显示 RAW',state.rawOnly?'已开启':'已关闭')}${choice('sources','folder-open','管理照片来源')}</div>`;
      }
      return `<div class="sheet-backdrop" data-dismiss-sheet="true"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-grip"></div><header class="sheet-heading"><span>${title}</span>${close}</header>${body}</section></div>`;
    }
    function photoFilter(){const d=initial();if(state.compare)return 'none';return `brightness(${1+d.exposure*.18}) contrast(${1+d.contrast*.004}) saturate(${1+d.saturation*.008})`;}
    function repaintPhoto(){
      const d=initial(),im=app.querySelector('.hero img');if(im){im.style.filter=photoFilter();im.style.transform=`rotate(${d.turns*90+(state.tool==='crop'&&state.view==='editor'?d.angle:0)}deg) scale(${(d.turns%2?1.5:1)*(d.angle?1.2:1)})`;}
      const cf=app.querySelector('.crop-frame');if(cf){const r=(ratioList.find(x=>x[0]===d.ratio)||['',3/2])[1]||3/2;let w=100*d.cropScale,h=w*3/2/r;if(h>100){h=100*d.cropScale;w=h*r*2/3;}cf.style.width=`${w}%`;cf.style.height=`${h}%`;cf.style.left=`${Math.max(0,Math.min(100-w,d.cropX+(100-w)/2))}%`;cf.style.top=`${Math.max(0,Math.min(100-h,d.cropY+(100-h)/2))}%`;}
      const mask=app.querySelector('.mask-region');
      if(mask){
        mask.style.left=`${d.maskX}%`;
        mask.style.top=`${d.maskY}%`;
        mask.style.width=`${18+d.maskRadius*.6}%`;
        mask.style.height=`${32+d.maskRadius*.9}%`;
        mask.style.opacity=d.maskOpacity/100;
        mask.style.transform=`rotate(${d.maskRotation}deg)`;
      }
      app.querySelectorAll('[data-value-for]').forEach(el=>{const key=el.dataset.valueFor;el.textContent=formatted(key,d[key],app.querySelector(`[data-field="${key}"]`)?.dataset.unit||'');el.classList.toggle('changed',!!d[key]);});
      const angle=app.querySelector('[data-angle]');if(angle)angle.textContent=`${d.angle.toFixed(1)}°`;
      const size=app.querySelector('[data-size]');if(size)size.textContent=cropSize();
    }
    function render(){
      const editing=state.view==='editor',isGallery=state.view==='gallery';
      app.className=`ru-app ${isGallery?'gallery':editing?'workspace':'viewer'} ${design.canvas==='中性浅色'&&!isGallery?'light':''} ${state.hidden?'no-chrome':''}`;
      app.setAttribute('data-screen',`${state.view}-${state.tool}`);
      app.innerHTML=`${status()}<div class="content">${isGallery?gallery():editing?editor():viewer()}</div><div class="home" aria-hidden="true"></div>${sheet()}${state.toast?`<div class="toast" role="status">${state.toast}</div>`:''}`;
      repaintPhoto();if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});
    }
    root.addEventListener('click',event=>{
      if(event.target.matches('[data-dismiss-sheet]')){state.sheet=null;render();return;}
      const btn=event.target.closest('button[data-action]');if(!btn||btn.disabled){if(event.target.closest('.hero')&&state.view==='viewer'){state.hidden=!state.hidden;render();}return;}
      const action=btn.dataset.action,value=btn.dataset.value;
      if(action==='toggle-tool-picker'){
        setToolPickerOpen(btn.getAttribute('aria-expanded')==='false');
        return;
      }
      if(action==='select-tool'){
        state.tool=btn.dataset.tool;
        if(state.tool==='tone')state.group=value;
        render();
        if(event.detail===0)app.querySelector('.tool-picker').focus({preventScroll:true});
        persist();
        return;
      }
      state.toast='';
      if(action==='photo'){if(state.selecting){state.selected=!state.selected;}else{state.photo=Number(btn.dataset.index);state.view='viewer';state.hidden=false;}}
      else if(action==='selection'){state.selecting=!state.selecting;state.selected=false;}
      else if(action==='filter'){state.rawOnly=value==='raw';}
      else if(action==='filter-raw'){state.rawOnly=!state.rawOnly;state.sheet=null;}
      else if(action==='back-gallery'){state.view='gallery';state.hidden=false;}
      else if(action==='edit'){startEdit();}
      else if(action==='cancel-edit'){state.draft=clone(state.saved);state.view='viewer';state.sheet=null;}
      else if(action==='save-edit'){state.saved=clone(state.draft);state.view='viewer';state.sheet=null;note('编辑已保存');persist();return;}
      else if(action==='channel'){state.channel=Number(value);}
      else if(action==='ratio'){change(d=>{d.ratio=value;d.cropX=0;d.cropY=0;d.cropScale=1;});return;}
      else if(action==='rotate-left'||action==='rotate-right'){change(d=>{d.turns=(d.turns+(action==='rotate-left'?3:1))%4;});return;}
      else if(action==='reset-crop'){change(d=>{d.turns=0;d.angle=0;d.ratio='原图';d.cropX=0;d.cropY=0;d.cropScale=1;});return;}
      else if(action==='reset-tool'){change(d=>{(sections[state.group]||[]).forEach(p=>d[p[1]]=0);});return;}
      else if(action==='undo'&&state.undo.length){state.redo.push(clone(state.draft));state.draft=state.undo.pop();}
      else if(action==='redo'&&state.redo.length){state.undo.push(clone(state.draft));state.draft=state.redo.pop();}
      else if(action==='mask-mode'){state.maskMode=value;}
      else if(action==='create-mask'){state.sheet=null;state.maskMode='范围';change(d=>{d.maskCount++;d.maskType=value;});return;}
      else if(action==='remove-mask'){state.sheet=null;change(d=>{d.maskCount=0;});return;}
      else if(action==='duplicate-mask'){state.sheet=null;change(d=>{d.maskCount++;});return;}
      else if(action==='invert-mask'){state.sheet=null;change(d=>{d.maskX=50-d.maskX;});return;}
      else if(action==='toggle-mask'){state.sheet=null;state.maskMode=state.maskMode==='范围'?'调整':'范围';}
      else if(action==='export-edited'||action==='export-embedded'){state.exportType=action.slice(7);}
      else if(action==='export-now'){state.sheet=null;note('已保存到相册');return;}
      else if(action==='confirm-delete'){state.sheet=null;state.selecting=false;state.selected=false;state.view='gallery';note('照片已删除');return;}
      else if(action==='copy-edit'){state.clipboard=clone(state.draft);state.sheet=null;note('已复制调色参数');return;}
      else if(action==='paste-edit'&&state.clipboard){state.sheet=null;change(d=>{const geo={angle:d.angle,turns:d.turns,ratio:d.ratio,cropX:d.cropX,cropY:d.cropY,cropScale:d.cropScale};Object.assign(d,clone(state.clipboard),geo);});return;}
      else if(action==='reset-all'){state.sheet=null;change(d=>Object.assign(d,neutral()));return;}
      else if(action==='histogram'){state.histogram=!state.histogram;state.sheet=null;}
      else if(action==='refresh'){state.sheet=null;note('照片已更新');return;}
      else if(action.startsWith('source-')){state.sheet=null;note(action==='source-local'?'已切换到系统相册':'目录选择');return;}
      else if(action==='close-sheet'){state.sheet=null;}
      else if(action==='settings'){state.sheet='settings';}
      else if(['export','delete','info','new-mask','mask-actions','edit-more','sources','gallery-more','viewer-more'].includes(action)){state.sheet=action;}
      render();persist();
    });
    function dismissToolPicker(event){
      if(!event.target.closest('.tool-picker,.tool-popover'))setToolPickerOpen(false);
    }
    root.addEventListener('focusin',dismissToolPicker);
    let sliderBefore=null,drag=null;
    root.addEventListener('pointerdown',event=>{
      dismissToolPicker(event);
      const slider=event.target.closest('input[data-field]');if(slider){sliderBefore=clone(state.draft);return;}
      const compare=event.target.closest('[data-compare]');if(compare){state.compare=true;repaintPhoto();return;}
      const target=event.target.closest('.crop-frame,.mask-region,[data-curve-point]');if(!target)return;
      const photo=app.querySelector('.hero').getBoundingClientRect();drag={target,x:event.clientX,y:event.clientY,before:clone(state.draft),photo};target.setPointerCapture(event.pointerId);event.preventDefault();
    });
    root.addEventListener('input',event=>{const f=event.target.dataset.field;if(!f)return;if(!sliderBefore)sliderBefore=clone(state.draft);state.draft[f]=Number(event.target.value);repaintPhoto();});
    root.addEventListener('change',event=>{if(event.target.dataset.field&&sliderBefore){state.undo.push(sliderBefore);state.redo=[];sliderBefore=null;const key=event.target.dataset.field;render();app.querySelector(`[data-field="${key}"]`)?.focus({preventScroll:true});persist();}});
    root.addEventListener('pointermove',event=>{
      if(!drag)return;const dx=(event.clientX-drag.x)/drag.photo.width*100,dy=(event.clientY-drag.y)/drag.photo.height*100;
      if(drag.target.matches('.crop-frame')){state.draft.cropX=Math.max(-20,Math.min(20,drag.before.cropX+dx));state.draft.cropY=Math.max(-20,Math.min(20,drag.before.cropY+dy));}
      else if(drag.target.matches('.mask-region')){state.draft.maskX=Math.max(0,Math.min(60,drag.before.maskX+dx));state.draft.maskY=Math.max(0,Math.min(35,drag.before.maskY+dy));}
      else{
        const rect=drag.target.closest('svg').getBoundingClientRect();
        state.draft.curve=Math.max(10,Math.min(90,100-(event.clientY-rect.top)/rect.height*100));
        const pointY=100-state.draft.curve;
        drag.target.setAttribute('cy',pointY);
        app.querySelector('.curve-point').setAttribute('cy',pointY);
        app.querySelector('.curve-line').setAttribute('d',curvePath(pointY));
        state.draft.exposure=(state.draft.curve-50)/80;
      }
      repaintPhoto();
    });
    root.addEventListener('pointerup',event=>{
      if(state.compare){state.compare=false;repaintPhoto();}
      if(drag){state.undo.push(drag.before);state.redo=[];drag=null;render();persist();}
    });
    root.addEventListener('pointercancel',()=>{
      state.compare=false;repaintPhoto();drag=null;
    });
    root.addEventListener('keydown',event=>{
      if(event.key!=='Escape')return;
      if(app.querySelector('.tool-picker[aria-expanded="true"]')){
        setToolPickerOpen(false,true);
        return;
      }
      if(state.sheet)state.sheet=null;
      else if(state.view==='editor'){state.view='viewer';state.draft=clone(state.saved);}
      else state.view='gallery';
      render();
    });
    let lastScreen=design.screen;
    function designRender(){if(design.screen!==lastScreen){lastScreen=design.screen;state.sheet=null;state.hidden=false;if(design.screen==='图库')state.view='gallery';else if(design.screen==='照片预览')state.view='viewer';else if(design.screen==='导出'){state.view='viewer';state.sheet='export';}else{startEdit(design.screen==='裁切'?'crop':design.screen==='蒙版'?'mask':'tone');if(design.screen==='曲线')state.group='曲线';else if(design.screen==='调色')state.group='光线';}}render();persist();}
    render();
    if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:designRender});tweak.addSelect(design,'screen',{label:'评审场景',options:['图库','照片预览','调色','曲线','蒙版','裁切','导出']});tweak.addSelect(design,'canvas',{label:'编辑画布',options:['沉浸深色','中性浅色']});}
    window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent;if(saved?.canvas&&saved.canvas!==design.canvas){design.canvas=saved.canvas;render();}});
  })();
  </script>
</div>
